{% extends "base.html" %}

{% block content %}
<div id="home-page" class="page active">
    <h2>Welcome to School Attendance System</h2>
    <p>Select a feature to get started:</p>
    
    <div class="feature-grid">
        <div class="feature-card" onclick="window.location.href='{{ url_for('attendance_init') }}'">
            <div class="feature-icon">📋</div>
            <h3>Attendance</h3>
            <p>Track student attendance before and after break</p>
        </div>
        
        <div class="feature-card" onclick="alert('Grades feature coming soon!')">
            <div class="feature-icon">📊</div>
            <h3>Grades</h3>
            <p>Manage and track student grades</p>
        </div>
    </div>
</div>
{% endblock %}
